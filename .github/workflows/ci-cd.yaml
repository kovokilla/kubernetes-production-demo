name: Test, build, package and deploy

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/**
      - charts/**
      - environments/**
      - infrastructure/**
      - scripts/**
      - tests/**
      - requirements-dev.txt
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/fetch-helm.py
      - run: bash scripts/validate.sh
      - run: bash scripts/validate-infrastructure.sh
      - run: python scripts/fetch-kubeconform.py
      - name: Validate Kubernetes schemas
        run: |
          for environment in local production; do
            .tools/kubeconform \
              -strict -summary -kubernetes-version 1.34.0 \
              ".artifacts/$environment.yaml"
          done

  build:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry path
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'repository=%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.repository }}/${{ matrix.component }}:sha-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record published image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: printf '%s\n' "$DIGEST" > "$COMPONENT.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.digest
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/fetch-helm.py
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: .artifacts/images
          merge-multiple: true
      - name: Reject stale source revisions
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            printf 'main changed during this build; refusing to publish a stale release.\n' >&2
            exit 1
          }
      - name: Update chart and production image digests
        run: |
          python scripts/update-release.py --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" \
            --digest-dir .artifacts/images
          .tools/helm lint charts/webapp --strict -f environments/production/values.yaml
          .tools/helm template demo charts/webapp --namespace demo \
            -f environments/production/values.yaml > .artifacts/release-manifests.yaml
          python scripts/check-manifests.py .artifacts/release-manifests.yaml
          mkdir -p .artifacts/release
          .tools/helm package charts/webapp --destination .artifacts/release
          cp environments/production/values.yaml .artifacts/release/values.yaml
      - name: Publish versioned Helm chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | .tools/helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          .tools/helm push ".artifacts/release/webapp-0.1.$GITHUB_RUN_NUMBER.tgz" \
            "oci://ghcr.io/$REGISTRY_OWNER/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-release
          path: .artifacts/release/
          retention-days: 30

  deploy:
    needs: release
    if: vars.ENABLE_DEPLOYMENT == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      # Store Helm release metadata in ConfigMaps; deployment credentials do not
      # need broad read/write access to application Secrets.
      HELM_DRIVER: configmap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/fetch-helm.py
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - uses: actions/download-artifact@v4
        with:
          name: helm-release
          path: .artifacts/release
      - name: Reject stale deployments
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Configure deployment credentials without logging them
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "kubeconfig"
          encoded = "".join(os.environ["KUBE_CONFIG_DATA"].split())
          data = base64.b64decode(encoded, validate=True)
          if not data:
              raise SystemExit("KUBE_CONFIG_DATA is empty")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "wb") as output:
              output.write(data)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"KUBECONFIG={path}\n")
          PY
      - name: Deploy the exact packaged release
        run: |
          kubectl -n demo get secret demo-app -o name
          kubectl -n demo get secret demo-tls -o name
          CHART=".artifacts/release/webapp-0.1.$GITHUB_RUN_NUMBER.tgz"
          .tools/helm upgrade --install demo "$CHART" --namespace demo \
            -f .artifacts/release/values.yaml --atomic --wait --timeout 5m
          kubectl -n demo rollout status deployment/demo-frontend --timeout=300s
          kubectl -n demo rollout status deployment/demo-backend --timeout=300s
      - name: Remove deployment credentials
        if: always()
        run: python3 -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"]) / "kubeconfig").unlink(missing_ok=True)'
