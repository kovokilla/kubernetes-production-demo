apiVersion: v1
kind: ConfigMap
metadata:
  name: production-demo-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  production-demo-overview.json: |
    {{- $dashboard := .Files.Get "files/dashboard.json" | fromJson }}
    {{- if .Values.gitops.enabled }}
    {{- $panels := list }}
    {{- range $panel := $dashboard.panels }}
    {{- if ne (int $panel.id) 4 }}
    {{- $panels = append $panels $panel }}
    {{- end }}
    {{- end }}
    {{- $_ := set $dashboard "panels" $panels }}
    {{- end }}
    {{- $dashboard | toPrettyJson | nindent 4 }}
