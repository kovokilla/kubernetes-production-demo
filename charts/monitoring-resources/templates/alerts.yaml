apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-and-jenkins
  labels: { release: monitoring }
spec:
  {{- $rules := .Files.Get "files/alerts.yaml" | fromYaml }}
  {{- if .Values.gitops.enabled }}
  {{- range $group := $rules.groups }}
  {{- $filtered := list }}
  {{- range $rule := $group.rules }}
  {{- if not (hasPrefix "JenkinsCredential" $rule.alert) }}
  {{- $filtered = append $filtered $rule }}
  {{- end }}
  {{- end }}
  {{- $_ := set $group "rules" $filtered }}
  {{- end }}
  {{- end }}
  {{- $rules | toYaml | nindent 2 }}
