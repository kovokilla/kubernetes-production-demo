apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-receiver-code
data:
  receiver.mjs: |
    {{- .Files.Get "files/receiver.mjs" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-receiver
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: monitoring-receiver }
  template:
    metadata:
      labels: { app.kubernetes.io/name: monitoring-receiver }
      annotations:
        checksum/code: {{ .Files.Get "files/receiver.mjs" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: receiver
          image: {{ .Values.receiver.image }}
          command: [node, /app/receiver.mjs]
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: expiry, mountPath: /metadata, readOnly: true }
      volumes:
        - name: code
          configMap: { name: monitoring-receiver-code }
        - name: expiry
          configMap:
            name: jenkins-monitoring-metadata
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-receiver
  labels: { app.kubernetes.io/name: monitoring-receiver }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: monitoring-receiver }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-receiver
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: monitoring-receiver }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: alertmanager }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: monitoring-receiver
  labels: { release: monitoring }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: monitoring-receiver }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
