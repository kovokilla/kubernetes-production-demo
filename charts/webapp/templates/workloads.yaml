{{- range $component := list "frontend" "backend" }}
{{- $settings := index $.Values $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webapp.name" $ }}-{{ $component }}
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webapp.name" $ }}-{{ $component }}
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $settings.replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        secret-revision: {{ $.Values.secretRevision | quote }}
        image-tag: {{ $settings.image.tag | quote }}
    spec:
      serviceAccountName: {{ include "webapp.name" $ }}-{{ $component }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
      containers:
        - name: {{ $component }}
          {{- if $settings.image.digest }}
          image: {{ printf "%s@%s" $settings.image.repository $settings.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" $settings.image.repository $settings.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ $settings.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- if eq $component "backend" }}
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "webapp.name" $ }}-config
                  key: APP_MESSAGE
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret must name an externally provisioned Secret" $.Values.existingSecret }}
                  key: signing-key
            {{- else }}
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "webapp.name" $ }}-config
                  key: BACKEND_URL
            {{- end }}
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webapp.name" $ }}-{{ $component }}
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
