# Jenkins uses unique local image tags and preloads every kind node.
frontend:
  image: { pullPolicy: Never }
backend:
  image: { pullPolicy: Never }
ingress:
  host: demo.localhost
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "false"
  tls:
    enabled: false
